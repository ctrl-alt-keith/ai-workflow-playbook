name: Markdown Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      - name: Set up experimental v2 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run checks
        run: |
          make v2-setup
          make check
