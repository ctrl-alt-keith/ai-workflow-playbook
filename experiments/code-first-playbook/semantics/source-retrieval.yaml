language: playbook-semantics/0
module: source-retrieval
owner: source.retrieval
imports:
- startup
records:
- id: action.retrieval-triggers
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.retrieval
  does: |
    Classify triggers before using prior conversation, summaries, memory, or pasted
    descriptions to reason about repository state.

    Mandatory source-first triggers require authoritative retrieval before
    stateful reasoning or recommendations:

    - GitHub pull request URLs, pull request numbers, or requests such as "review
      this PR", "review directly", "take a look", "check this PR", "continue this
      PR", or "is this ready?"

    - GitHub issue URLs, issue numbers, or requests such as "continue from this
      issue", "implement this issue", or "what is left on this issue?"

    - repository identifiers, repository URLs, or local repository paths

    - repo-aware advisory or evaluation requests where a repository is explicitly
      named and the answer depends on that repository's actual state

    - branch names, refs, tags, commit SHAs, comparison ranges, or release refs

    - requests to assess mergeability, CI status, review state, changed files,
      issue closure, validation status, or current implementation scope

    - requests involving PRs, issues, branches, workflows, checks, validation
      state, merge sequencing, or implementation quality; treat these as mandatory
      source-first triggers and select the appropriate repo-readiness interaction
      mode rather than defaulting to conversational analysis

    - claims or requested changes that depend on current external provider,
      public API, SDK, CLI, package, or hosted-platform behavior

    Optional triggers may guide retrieval when the next action depends on current
    state, but they do not require source inspection for purely conversational
    answers:

    - pasted summaries, completion reports, copied diffs, screenshots, or release
      notes without a live artifact identifier

    - references to earlier conversation, prior work, a remembered plan, previous
      operational synthesis, or broad repository names without a state-dependent
      action

    - conceptual questions about workflow patterns, review posture, or tradeoffs

    Ambiguous cases must be resolved before stateful conclusions. If "continue",
    "the branch", "the PR", or similar wording points to a clear source, inspect
    that source. If the target is unclear, ask a narrow clarifying question or
    report the missing identifier. Do not fill the gap with conversational
    inference.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Operational adoption
  - Permission for the dependent operation
  - Complete executor contract
  action_kind: behavior
- id: action.retrieval-triggers-failure
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.codex
  - source.retrieval
  does: Report missing identifiers or unavailable mandatory source and stop dependent conclusions. Do
    not substitute conversational inference; use another permitted qualified route where available.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - New source-access permission
  - Authority from failure or fallback
  action_kind: behavior
- id: boundary.retrieval-triggers
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: The specific dependent Stateful reasoning for operation=current-operation. Check current outside
    authority immediately before it.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Eligibility to perform the operation
  action_kind: boundary
- id: evidence.retrieval-triggers
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: Record source-specific checks, unresolved questions and evidence of applying this unit to operation=current-operation.
    Retrieval alone does not prove adequacy or compliance.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Permission
  - Discharge of external judgment
  action_kind: evidence
- id: context.retrieval-triggers
  kind: context
  owner: source.retrieval
  status: active
  references: []
  body: Trigger classification is an externally supplied judgment anchored to the full Triggers section.
    The pilot does not infer it from a phrase classifier.
- id: pb.retrieval-triggers
  kind: rule
  owner: source.retrieval
  status: active
  references: []
  unit: pb.retrieval-triggers
  when:
    is:
    - fact.repository_work
    - true
  effect:
    actor: controller
    modality: must
    action: action.retrieval-triggers
    parameters:
      operation: current-operation
  requires:
  - source.retrieval
  activates:
  - target: pb.claim-verification
    when:
      is:
      - fact.mandatory_trigger
      - true
  before:
  - boundary.retrieval-triggers
  overrides: []
  lifetime:
    starts: Before continuity reasoning about current repository facts
    persists_within: Source ownership and mandatory retrieval checks for the current claim
    ends_when:
      any:
      - is:
        - fact.leaves_repository_work
        - true
      - is:
        - fact.repository_changed
        - true
  failure:
    when:
      is:
      - fact.source_available
      - false
    action: action.retrieval-triggers-failure
    alternatives: []
    scope: Stateful reasoning
  authority_ref:
    source: source.readiness
    question: What does current human direction authorize for operation=current-operation? Resolve external
      interaction-mode and action-latch, plus source-specific restrictions.
    check_at: immediately-before-action
  completion:
    evidence: evidence.retrieval-triggers
    boundary: boundary.retrieval-triggers
    question: Were the unit and all required external owners applied sufficiently? This remains controller
      judgment.
  context:
  - context.retrieval-triggers
- id: action.claim-verification
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.core
  - source.retrieval
  - source.review
  does: |
    Use this gate whenever a mandatory trigger is present:

    - Trigger: name the artifact or request that activated retrieval.

    - Source: name the authoritative source used for current state.

    - Checks: list the state checks required by the task.

    - Result: mark the gate `verified`, `partial`, or `blocked`.

    - Unknowns: state anything required for the task that remains unverified.

    If direct verification did not happen, say exactly:
    `unknown → referenced repo state was not verified`.

    Acceptable authoritative sources depend on the claim:

    - Repository files, local `git` state, and checked-out refs are authoritative
      for the inspected local worktree only.

    - GitHub PRs, issues, review threads, CI, mergeability, and branch metadata are
      authoritative for current remote PR and issue state.

    - CI systems and validation command output are authoritative for the checks
      they actually ran.

    - Official provider documentation, schemas, SDK docs, CLI docs, changelogs, or
      release notes are authoritative for external public API behavior.

    For pull requests and issues, do not infer implementation quality, scope, risk,
    merge readiness, or correctness from titles, summaries, commit messages,
    reported check status, or conversational descriptions. Inspect changed files,
    validation or check state, scope boundaries, and overlap or conflict risk
    directly.

    If the required source is unavailable, blocked, or access is declined, stop the
    stateful workflow and report the blocker. Do not provide readiness,
    mergeability, approval, closure, or implementation-completeness conclusions
    from secondhand context.

    If only part of the source can be verified, return a partial result. Separate
    verified facts from unknowns, avoid recommendations that depend on missing
    state, and say what retrieval would complete the gate.

    If local and remote state disagree, state which source supports each fact and
    which one controls the decision. For repository completion, GitHub PR and issue
    state usually controls remote readiness, while local `git` state controls only
    the current checkout.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Operational adoption
  - Permission for the dependent operation
  - Complete executor contract
  action_kind: behavior
- id: action.claim-verification-failure
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.retrieval
  does: Report verified facts separately from unknowns. Stop the stateful workflow if a materially required
    source remains unavailable through permitted routes; no summary-based recommendation.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - New source-access permission
  - Authority from failure or fallback
  action_kind: behavior
- id: boundary.claim-verification
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: The specific dependent Readiness, mergeability, approval, closure or implementation-completeness
    claims for operation=current-operation. Check current outside authority immediately before it.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Eligibility to perform the operation
  action_kind: boundary
- id: evidence.claim-verification
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: Record source-specific checks, unresolved questions and evidence of applying this unit to operation=current-operation.
    Retrieval alone does not prove adequacy or compliance.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Permission
  - Discharge of external judgment
  action_kind: evidence
- id: context.claim-verification
  kind: context
  owner: source.retrieval
  status: active
  references: []
  body: The required unverified-state literal and all claim-dependent inspection details stay in the exact
    canonical read; rendering is not proof those checks ran.
- id: pb.claim-verification
  kind: rule
  owner: source.retrieval
  status: active
  references: []
  unit: pb.claim-verification
  when:
    is:
    - fact.mandatory_trigger
    - true
  effect:
    actor: controller
    modality: must
    action: action.claim-verification
    parameters:
      operation: current-operation
  requires:
  - source.retrieval
  - source.core
  - source.review
  activates: []
  before:
  - boundary.claim-verification
  overrides: []
  lifetime:
    starts: When a mandatory retrieval trigger is present
    persists_within: Claim-specific verified/partial/blocked evidence boundary
    ends_when:
      any:
      - is:
        - fact.leaves_repository_work
        - true
      - is:
        - fact.repository_changed
        - true
  failure:
    when:
      is:
      - fact.verification_complete
      - false
    action: action.claim-verification-failure
    alternatives: []
    scope: Readiness, mergeability, approval, closure or implementation-completeness claims
  authority_ref:
    source: source.readiness
    question: What does current human direction authorize for operation=current-operation? Resolve external
      interaction-mode and action-latch, plus source-specific restrictions.
    check_at: immediately-before-action
  completion:
    evidence: evidence.claim-verification
    boundary: boundary.claim-verification
    question: Were the unit and all required external owners applied sufficiently? This remains controller
      judgment.
  context:
  - context.claim-verification
- id: action.retrieval-recovery
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.codex
  - source.retrieval
  - source.start
  does: |
    Recovery is required when source-first ordering has already been missed. This
    includes:

    - the assistant answered before opening the referenced PR, issue, repository,
      branch, commit, path, or provider source

    - conversational continuity outran verification

    - inferred state was used before retrieval

    - a human explicitly calls out missing source inspection

    - conversational context conflicts with authoritative state

    When retrieval remains available, recovery restores verified state before
    conversational repair:

    1. Halt continuity reasoning.

    2. Identify every unresolved mandatory trigger.

    3. Retrieve the authoritative source state for those triggers.

    4. Discard, correct, or mark unverified any assumptions made before retrieval.

    5. Resume from the restored verified state and stated unknowns.

    Acknowledgment alone is not recovery. Explaining the violation is not
    remediation. Recovery must perform the missing retrieval or inspection when it
    is available, then explain only remaining blockers, uncertainty, or corrections
    that still matter after inspection.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Operational adoption
  - Permission for the dependent operation
  - Complete executor contract
  action_kind: behavior
- id: action.retrieval-recovery-failure
  kind: action
  owner: source.retrieval
  status: active
  references:
  - source.codex
  - source.retrieval
  - source.start
  does: If no permitted qualified authoritative route remains, stop affected stateful conclusions and
    name the gap. A disallowed raw API transport with an available approved connector requires connector
    recovery, not premature failure.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - New source-access permission
  - Authority from failure or fallback
  action_kind: behavior
- id: boundary.retrieval-recovery
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: The specific dependent Recovery-dependent conclusion for operation=current-operation. Check current
    outside authority immediately before it.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Eligibility to perform the operation
  action_kind: boundary
- id: evidence.retrieval-recovery
  kind: action
  owner: source.retrieval
  status: active
  references: []
  does: Record source-specific checks, unresolved questions and evidence of applying this unit to operation=current-operation.
    Retrieval alone does not prove adequacy or compliance.
  parameters:
  - name: operation
    type: term.operation
    required: true
  does_not_establish:
  - Permission
  - Discharge of external judgment
  action_kind: evidence
- id: context.retrieval-recovery
  kind: context
  owner: source.retrieval
  status: active
  references: []
  body: Bootstrap transport recovery combines this unit with unprojected Minimum-Sufficient Retrieval
    and Codex raw-API policy. No new transport permission or fallback ladder is introduced.
- id: pb.retrieval-recovery
  kind: rule
  owner: source.retrieval
  status: active
  references:
  - pb.claim-verification
  unit: pb.retrieval-recovery
  when:
    is:
    - fact.retrieval_missed
    - true
  effect:
    actor: controller
    modality: must
    action: action.retrieval-recovery
    parameters:
      operation: current-operation
  requires:
  - source.retrieval
  - source.start
  - source.codex
  activates: []
  before:
  - boundary.retrieval-recovery
  overrides: []
  lifetime:
    starts: Missed mandatory source-first ordering
    persists_within: Recovery obligation until retrieval and correction are complete
    ends_when:
      all:
      - is:
        - fact.retrieval_missed
        - false
      - is:
        - fact.verification_complete
        - true
  failure:
    when:
      is:
      - fact.source_available
      - false
    action: action.retrieval-recovery-failure
    alternatives: []
    scope: Recovery-dependent conclusion
  authority_ref:
    source: source.readiness
    question: What does current human direction authorize for operation=current-operation? Resolve external
      interaction-mode and action-latch, plus source-specific restrictions.
    check_at: immediately-before-action
  completion:
    evidence: evidence.retrieval-recovery
    boundary: boundary.retrieval-recovery
    question: Were the unit and all required external owners applied sufficiently? This remains controller
      judgment.
  context:
  - context.retrieval-recovery
